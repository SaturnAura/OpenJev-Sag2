[project]
name = "openjev-sag2"
version = "1.0.0"
description = "Reproducible OpenJev decision heads for SAG2 evidence retrieval"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "accelerate==1.14.0",
  "aiohttp>=3.9,<4",
  "fastapi>=0.115,<1",
  "numpy>=1.26,<2",
  "pydantic>=2,<3",
  "pyarrow>=15,<22",
  "PyYAML>=6,<7",
  "torch==2.6.0",
  "transformers==5.14.1",
  "uvicorn>=0.31,<1",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["openjev*", "sag2*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

